# The whole stack. One t4g.small runs this comfortably for three people;
# managed Postgres and a load balancer would roughly triple the bill for no
# benefit at this size, and can be moved to the day there is a reason.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ttcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ttcloud}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ttcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published. Nothing outside this network has any business reaching it.

  web:
    build: ./server
    restart: unless-stopped
    entrypoint: ["/srv/entrypoint.sh"]
    command: ["gunicorn", "-c", "gunicorn.conf.py", "app:create_app()"]
    environment: &app_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ttcloud}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ttcloud}
      DATABASE_URL_PSQL: postgresql://${POSTGRES_USER:-ttcloud}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ttcloud}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      FLASK_ENV: production
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Africa/Nairobi}
    depends_on:
      db: {condition: service_healthy}

  worker:
    build: ./server
    restart: unless-stopped
    # No entrypoint: migrations are web's job, once. Two containers racing
    # `alembic upgrade` is how a schema ends up half-applied.
    command: ["python", "-m", "app.worker"]
    environment: *app_env
    depends_on:
      db: {condition: service_healthy}
      web: {condition: service_started}

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    depends_on: [web]

volumes:
  pgdata:
  caddydata:
  caddyconfig:
