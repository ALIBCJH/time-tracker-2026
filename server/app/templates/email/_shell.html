{#- Table layout and inline styles throughout: mail clients ignore <style>
    blocks and most ignore flexbox entirely. -#}
<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:{{ C.track }};">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:{{ C.track }};">
<tr><td align="center" style="padding:32px 16px;">
  <table role="presentation" width="600" cellpadding="0" cellspacing="0"
         style="width:600px;max-width:100%;background:#ffffff;border:1px solid {{ C.line }};border-radius:14px;">
    <tr><td style="background:#14141b;border-radius:13px 13px 0 0;padding:26px 36px 24px;">
      <div style="font:600 11px {{ C.font }};color:#9aa1ad;letter-spacing:.16em;text-transform:uppercase;">
        TimeTracker&nbsp;&nbsp;&middot;&nbsp;&nbsp;{{ kicker }}</div>
      <div style="padding-top:10px;font:700 {{ title_size }}px {{ C.font }};color:#ffffff;">{{ title }}</div>
      <div style="margin-top:16px;width:56px;height:3px;border-radius:2px;background:{{ accent }};font-size:0;">&nbsp;</div>
    </td></tr>
    {% block content %}{% endblock %}
    <tr><td style="background:#fafaf8;border-top:1px solid {{ C.line }};border-radius:0 0 13px 13px;padding:16px 36px;">
      <div style="font:400 12px/1.6 {{ C.font }};color:{{ C.muted }};">
        Sent automatically by TimeTracker &nbsp;&middot;&nbsp; {{ sent_at }}<br>
        {% block footer_detail %}{% endblock %}
      </div>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
